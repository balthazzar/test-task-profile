services:
  db:
    image: postgres:16-alpine
    container_name: test-task-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: test_task
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_task"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: test-task-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/test_task?schema=public

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "3000:3000"

volumes:
  postgres_data: